<!DOCTYPE html>
<html>
<head>
    <title>Presentation Access</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 350px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #content {
            display: none;
        }

        a {
            color: #60a5fa;
            font-size: 20px;
        }
    </style>
</head>
<body>

<div class="box">
    <div id="login">
        <h2>Enter Password</h2>
        <input type="password" id="password" placeholder="Password">
        <br>
        <button onclick="checkPassword()">Open</button>
        <p id="error"></p>
    </div>

    <div id="content">
        <h2>Presentation Access Granted</h2>
        <a href="Ayham's project.pptx" download>
            Download Presentation
        </a>
    </div>
</div>

<script>
function checkPassword() {
    const correctPassword = "112238";
    const enteredPassword = document.getElementById("password").value;

    if (enteredPassword === correctPassword) {
        document.getElementById("login").style.display = "none";
        document.getElementById("content").style.display = "block";
    } else {
        document.getElementById("error").innerText = "Wrong password!";
    }
}
</script>

</body>
</html>
